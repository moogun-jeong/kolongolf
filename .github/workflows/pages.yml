# GitHub Pages도 저장소 루트가 아니라 allowlist 빌드 결과(`dist/`)만 배포합니다.
#
# 최초 1회 저장소 설정이 필요합니다.
#   Settings > Pages > Build and deployment > Source 를 "GitHub Actions"로 바꿔주세요.
#   ("Deploy from a branch"로 두면 예전처럼 저장소 전체가 공개됩니다.)

name: Deploy dist to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dist
        run: node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
